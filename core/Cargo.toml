[package]
name = "iptvc-core"
version = "0.1.0"
edition = "2021"
description = "iptvc's wasm core: catalog search, EPG/catch-up, MPEG audio (MP2) decoding"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
unicode-normalization = "0.1"
symphonia-core = "0.6"
symphonia-bundle-mp3 = { version = "0.6", default-features = false, features = ["mp1", "mp2", "mp3"] }
quick-xml = "0.42"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
